<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="tesseract">
  <!-- Tesseract (4D hypercube) drawn in an angled 3D perspective (~45°): an inner
       cube nested inside an outer cube, corresponding vertices connected. Green
       wireframe on a dark rounded tile so it reads on any browser tab. -->
  <rect width="64" height="64" rx="14" fill="#0e0e0e" />
  <g fill="none" stroke="#6ee7b7" stroke-linecap="round" stroke-linejoin="round">

    <!-- connectors: outer vertex -> inner vertex (dimmer, for depth) -->
    <g stroke-width="1.3" stroke-opacity="0.45">
      <line x1="52.5" y1="20.2" x2="40.6" y2="27.0" />
      <line x1="37.5" y1="10.4" x2="34.3" y2="22.9" />
      <line x1="52.5" y1="48.0" x2="40.6" y2="38.7" />
      <line x1="37.5" y1="38.2" x2="34.3" y2="34.6" />
      <line x1="26.5" y1="25.8" x2="29.7" y2="29.4" />
      <line x1="11.5" y1="16.0" x2="23.4" y2="25.3" />
      <line x1="26.5" y1="53.6" x2="29.7" y2="41.1" />
      <line x1="11.5" y1="43.9" x2="23.4" y2="37.0" />
    </g>

    <!-- inner cube -->
    <g stroke-width="1.7" stroke-opacity="0.9">
      <line x1="40.6" y1="27.0" x2="29.7" y2="29.4" />
      <line x1="34.3" y1="22.9" x2="23.4" y2="25.3" />
      <line x1="40.6" y1="38.7" x2="29.7" y2="41.1" />
      <line x1="34.3" y1="34.6" x2="23.4" y2="37.0" />
      <line x1="40.6" y1="27.0" x2="40.6" y2="38.7" />
      <line x1="34.3" y1="22.9" x2="34.3" y2="34.6" />
      <line x1="29.7" y1="29.4" x2="29.7" y2="41.1" />
      <line x1="23.4" y1="25.3" x2="23.4" y2="37.0" />
      <line x1="40.6" y1="27.0" x2="34.3" y2="22.9" />
      <line x1="40.6" y1="38.7" x2="34.3" y2="34.6" />
      <line x1="29.7" y1="29.4" x2="23.4" y2="25.3" />
      <line x1="29.7" y1="41.1" x2="23.4" y2="37.0" />
    </g>

    <!-- outer cube -->
    <g stroke-width="2.2">
      <line x1="52.5" y1="20.2" x2="26.5" y2="25.8" />
      <line x1="37.5" y1="10.4" x2="11.5" y2="16.0" />
      <line x1="52.5" y1="48.0" x2="26.5" y2="53.6" />
      <line x1="37.5" y1="38.2" x2="11.5" y2="43.9" />
      <line x1="52.5" y1="20.2" x2="52.5" y2="48.0" />
      <line x1="37.5" y1="10.4" x2="37.5" y2="38.2" />
      <line x1="26.5" y1="25.8" x2="26.5" y2="53.6" />
      <line x1="11.5" y1="16.0" x2="11.5" y2="43.9" />
      <line x1="52.5" y1="20.2" x2="37.5" y2="10.4" />
      <line x1="52.5" y1="48.0" x2="37.5" y2="38.2" />
      <line x1="26.5" y1="25.8" x2="11.5" y2="16.0" />
      <line x1="26.5" y1="53.6" x2="11.5" y2="43.9" />
    </g>
  </g>
</svg>

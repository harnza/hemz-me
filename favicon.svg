<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="tesseract">
  <!-- Tesseract (4D hypercube): an inner square nested inside an outer square with
       the corresponding corners connected — the classic projection of a 4D cube.
       Green wireframe on a dark rounded tile so it reads on any browser tab. -->
  <rect width="64" height="64" rx="14" fill="#0e0e0e" />
  <g fill="none" stroke="#6ee7b7" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round">
    <!-- connecting edges (dimmer, for depth) -->
    <g stroke-opacity="0.5">
      <line x1="12" y1="12" x2="23" y2="23" />
      <line x1="52" y1="12" x2="41" y2="23" />
      <line x1="52" y1="52" x2="41" y2="41" />
      <line x1="12" y1="52" x2="23" y2="41" />
    </g>
    <!-- outer cube face -->
    <rect x="12" y="12" width="40" height="40" rx="2" />
    <!-- inner cube face -->
    <rect x="23" y="23" width="18" height="18" rx="1.5" />
  </g>
</svg>
